<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Crivo TIM</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 270px; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    h2 { font-size: 14px; margin: 14px 0 6px; }
    p.hint { font-size: 11px; color: #666; margin: 0 0 8px; }
    .linha { display: flex; gap: 8px; }
    label { flex: 1; display: block; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
    label:has(input:checked) { border-color: #2563eb; background: #eff6ff; }
    #conexao { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; font-size: 12px; }
    #conexao .sis { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .bolinha { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex: none; }
    .bolinha.on { background: #16a34a; }
    .bolinha.off { background: #dc2626; }
    #resumo { font-weight: 600; margin-top: 6px; }
    #status { font-size: 12px; color: #16a34a; margin-top: 6px; min-height: 14px; }
    #aviso { font-size: 12px; color: #b42318; }
    #versao { font-size: 10px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Este computador é o…</h1>
  <p class="hint">Fica salvo neste PC, mesmo fechando o Chrome. Cada computador escolhe um número diferente.</p>
  <div class="linha">
    <label><input type="radio" name="pc" value="1" /> PC 1</label>
    <label><input type="radio" name="pc" value="2" /> PC 2</label>
    <label><input type="radio" name="pc" value="3" /> PC 3</label>
  </div>

  <div id="secaoAba">
    <h2>Esta aba é o…</h2>
    <p class="hint">Vale só pra esta aba do Easy Vendas. Na outra aba, escolha o outro sistema.</p>
    <div class="linha">
      <label><input type="radio" name="sistema" value="1" /> Sistema 1: cliente</label>
      <label><input type="radio" name="sistema" value="2" /> Sistema 2: negociação</label>
    </div>
  </div>

  <h2>Conexão deste PC</h2>
  <div id="conexao">
    <div class="sis"><span class="bolinha" id="b1"></span> Sistema 1: cliente — <span id="t1">…</span></div>
    <div class="sis"><span class="bolinha" id="b2"></span> Sistema 2: negociação — <span id="t2">…</span></div>
    <div id="resumo"></div>
  </div>

  <div id="status"></div>
  <div id="aviso"></div>
  <div id="versao"></div>
  <script src="popup.js"></script>
</body>
</html>
