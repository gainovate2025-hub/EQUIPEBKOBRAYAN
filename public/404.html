<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Painel BKO</title>
  <script type="text/javascript">
    // GitHub Pages não sabe lidar com rotas internas de SPA (ex: /EQUIPEBKOBRAYAN/supervisor)
    // — só existe o arquivo index.html na raiz. Esse truque manda o navegador de volta
    // pro index.html guardando o caminho original numa query string, e o index.html
    // (veja o script equivalente lá) devolve a URL certa antes do React Router ler.
    var segmentsToKeep = 1 // mantém "/EQUIPEBKOBRAYAN"
    var l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
</head>
<body></body>
</html>
